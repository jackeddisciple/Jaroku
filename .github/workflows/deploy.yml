# Deploying, in the only order that survives a rolling release.
#
# THE ORDER IS THE WHOLE FILE:
#
#   1. CI has passed. A deploy that runs the tests itself is a deploy that skips them when
#      somebody is in a hurry.
#   2. THE MIGRATION GATE, against what this deploy would newly apply. It refuses a statement
#      that would break the version currently serving — see server/src/db/expandContract.ts.
#   3. Build, and pin the digest. A tag is a mutable pointer, and two machines resolving one tag
#      during a rolling deploy can end up running different code.
#   4. MIGRATE, to completion, before any new machine takes traffic. Fly's release command does
#      this, and a non-zero exit stops the deploy with the old version still serving.
#   5. Roll the gateway one machine at a time; replace the workers all at once, because they
#      serve no connections and their graceful shutdown already requeues what they were holding.
#
# WHAT IS NOT HERE IS A ROLLBACK STEP. A rollback is a deploy of the previous digest, and it is
# safe precisely because of the expand/migrate/contract rule: the old code still runs against the
# new schema. A deploy that broke that rule cannot be rolled back — which is why the gate at step
# 2 is a gate rather than a warning.
#
# TWO WAYS IN, TWO TARGETS. A `v*` tag or a manual run deploys the production topology — the gateway
# and the workers — exactly as before. And every push to main that CI passes deploys `fly.toml`, the
# jaroku-api app the shipped desktop build talks to. That second path exists because the two drifted
# hundreds of commits apart: the app shipped subscription Chat to a server that had never heard of it.

name: Deploy

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  # EVERY GREEN MAIN. `workflow_run` fires when CI finishes, passed or not, so the job that uses it
  # reads the conclusion rather than assuming it.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  # One deploy at a time. Two releases migrating the same database concurrently is the situation
  # the advisory lock exists to survive, not something to do on purpose.
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # THE TAG AND MANUAL PATH, unchanged.
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci
        working-directory: server

      - name: the migration gate
        working-directory: server
        run: npm run migrate:check

      - name: the generated configuration is the committed one
        working-directory: server
        run: |
          npm run edge:render -- --check
          npm run obs:render -- --check

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: gateway - migrations run in the release command, before traffic
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --config deploy/fly/gateway.fly.toml --strategy rolling --wait-timeout 10m

      - name: workers
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --config deploy/fly/worker.fly.toml --strategy immediate --wait-timeout 10m

  deploy-api:
    # WHEN CI PASSED ON A PUSH TO MAIN, and only then: a pull request's run never deploys, and neither
    # does a failed or a cancelled one.
    if: >-
      github.event_name == 'workflow_run'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      # THE COMMIT CI PASSED, not whatever main points at by the time this starts.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # AND ONLY WHILE IT IS STILL THE NEWEST. Two green runs finishing out of order would otherwise
      # deploy the older commit last; the newer commit's own run deploys that one instead.
      - name: only the newest green commit deploys
        id: newest
        run: |
          git fetch --depth=1 origin main
          if [ "$(git rev-parse FETCH_HEAD)" = "${{ github.event.workflow_run.head_sha }}" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "main has moved past this commit; its own green run deploys the newer one."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      # THE GATE RUNS WHERE IT COUNTS. CI already ran `migrate:check` on this exact commit, and
      # `fly.toml`'s release command runs it again against the live database, then migrates, before any
      # machine takes traffic — a non-zero exit stops the deploy with the old version still serving.
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.newest.outputs.deploy == 'true'

      - name: jaroku-api - migrations run in the release command, before traffic
        if: steps.newest.outputs.deploy == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --config fly.toml --remote-only --wait-timeout 10m
