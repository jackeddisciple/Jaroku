# Everything that has to be true before a change is merged.
#
# THE SUITES ARE PLAIN SCRIPTS, so this file is mostly a list of them rather than a test-runner
# configuration. That is the same reason the migration runner has no dependency and the fixtures
# are checked-in files: what runs in CI is what a developer runs locally, spelled the same way.
#
# THREE GATES THAT ARE NOT TESTS, and each exists because the alternative is remembering:
#
#   `migrate:check` refuses a migration that would break the version currently serving.
#   `edge:render --check` refuses an edge configuration that has drifted from its source table.
#   `obs:render --check` does the same for the alerting rules.
#
# Postgres and Redis run as services, so the halves of the suites that skip without
# JAROKU_PG_URL — the RLS policies, the driver parity, half of tenancy — actually run here. Those
# are exactly the properties that hold on SQLite and not on Postgres, which is why a green local
# run is not enough.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: jaroku
          POSTGRES_PASSWORD: jaroku
          POSTGRES_DB: jaroku
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jaroku -d jaroku"
          --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 30

    env:
      JAROKU_PG_URL: postgres://jaroku:jaroku@127.0.0.1:5432/jaroku
      JAROKU_REDIS_URL: redis://127.0.0.1:6379

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci
        working-directory: server

      - name: typecheck
        run: npm run typecheck
        working-directory: server

      - name: the gates that are not tests
        working-directory: server
        run: |
          npm run migrate:check
          npm run edge:render -- --check
          npm run obs:render -- --check

      # MOST OF THE POSTGRES SUITES DO NOT NEED THIS, and that is why it was missing. Eighteen of
      # them go through `withScratchPostgres`, which CREATEs its own database, migrates it, and
      # drops it — hermetic, order-independent, and needing nothing of the service container but
      # a connection. `rls.test.ts` is the exception on purpose: row-level security is a property
      # of a real database's roles and policies, so it connects to JAROKU_PG_URL itself and
      # expects the schema to be there. Nothing put it there, so every RLS assertion ran against
      # an empty database.
      #
      # It failed as `relation "steps" does not exist` from the CLEANUP block, which is the least
      # informative sentence available: the first statement in the suite had already failed for
      # the same reason and the `finally` overwrote it on the way out.
      #
      # This is also the only step in the job that applies migrations the way a deploy does —
      # against a database that already exists, rather than into one created a moment earlier.
      - name: migrate the service database
        working-directory: server
        env:
          JAROKU_DB_DRIVER: postgres
        run: npm run migrate

      - name: the database and tenancy
        working-directory: server
        run: |
          npm run test:migrate
          npm run test:db
          npm run test:driver
          npm run test:db-postgres
          npm run test:shape-parity
          npm run test:payloads
          npm run test:adversarial
          npm run test:identity
          npm run test:rls
          npm run test:db-boundary
          npm run test:tenancy
          npm run test:migration-gate
          # A literal 0 is not a false, and only Postgres says so. It reads the schema for which
          # columns are boolean and the production SQL for what is written into them — because the
          # bug it exists for shipped a release: creating a thread threw on the production driver
          # and every thread suite opens SQLite. This one needs no database, so it fails on the
          # laptop where that SQL gets written rather than here.
          npm run test:boolean-literals
          # And its sibling one type over. A `timestamptz` is not a string either, and the Activity pulse
          # grouped its spend column with `SUBSTR(occurred_at, ...)` — TEXT on SQLite, a real timestamp on
          # Postgres, and there is no such overload there. Every Activity suite opens SQLite, so the whole
          # cost band could never have run on the production driver and nothing said so. Reads the schema
          # for which columns are timestamps and the production SQL for what is done to them, so it fails
          # on the laptop where that SQL gets written rather than here.
          npm run test:timestamp-text

      - name: storage, secrets and checkpoints
        working-directory: server
        run: |
          npm run test:object-keys
          npm run test:objects
          npm run test:project-store
          npm run test:secrets
          npm run test:vault
          npm run test:secret-refs
          npm run test:secret-schema
          npm run test:secret-passcode
          npm run test:secret-routes
          npm run test:secret-import
          npm run test:provider-key-migration
          npm run test:secrets-e2e
          npm run test:checkpoint-threads
          npm run test:branch

      - name: auth, HTTP and the hardening pass
        working-directory: server
        run: |
          npm run test:http
          npm run test:security-headers
          npm run test:rate-limit
          npm run test:jwks
          npm run test:jwt
          npm run test:session
          npm run test:resolve
          npm run test:capabilities
          # ADMIN MODE, which is a permission bypass and is therefore mostly asserted by what it must NOT
          # do. Two flags and a request can reach neither: `isAdmin` comes from an environment variable
          # read at session hydration, `adminMode` from this process’s memory. Its subtlest assertion is
          # the desktop one — the session token lives in the OS keychain and survives quitting, so if the
          # mode were persisted ANYWHERE it would stay on across dozens of launches. The suite greps its
          # own source for a persistence call to prove there is nowhere for it to survive.
          npm run test:admin-mode
          npm run test:tickets
          # THE THREE SHORT-LIVED SECRETS A SIGN-IN IS BUILT OUT OF, and the Google round trip on
          # top of them. Its store half runs three times — memory, SQLite, Postgres — because
          # "exactly one caller wins" is a row lock on one driver and a serialised transaction on
          # another, and a session ticket buys an ACCOUNT rather than a socket: a double-spend is
          # two sessions from one sign-in. Its Google half needs no Google at all, which is the
          # only reason it runs: every check the ID-token verifier makes is exercised against a
          # token the suite signs itself, so `aud`, `nonce`, `alg: none` and a payload edited after
          # signing are all refused here rather than in somebody's console. A suite that needed a
          # real Google project is a suite that runs when somebody remembers.
          npm run test:sign-in
          # §3.4'S ONE SCREEN, and most of the suite is about what it must NOT reject. "Emoji
          # allowed (people put them in their display names)" is the specification's own line, and
          # the instinct to sanitise a display name is the instinct that rejects أحمد, 李伟 and
          # O'Brien — three real names, one of which is somebody's whole identity. So the accepted
          # list is the long one, the refused list is three cases, and zero-width characters are
          # asserted to pass because U+200D is load-bearing in emoji sequences. Beside it, the rule
          # a PATCH exists for — changing the marketing box must not clear a name by omitting it —
          # and the audit row, which records WHICH fields moved and never their values.
          npm run test:profile
          # §7S LAST THREE ROUTES AND §5.3S RESUME. Its load-bearing assertion is that the step
          # only ever moves FORWARD — a property of the STATEMENT rather than of the handler, so
          # it needs the requests actually racing: two tabs on step 3 pressing Continue at once
          # must not leave somebody on the lower of the two. And §5.4s promise is asserted as an
          # ABSENCE, against an account that HAS a renamed workspace: a restart that cascaded
          # would pass every assertion about the flag and quietly destroy what the promise was
          # about.
          npm run test:onboarding
          # THE MESSAGE AND THE TWO PROVIDERS, neither of which touches a network here. The half
          # that cannot be checked any other way is the request each provider actually gets: a
          # header spelled `X-Postmark-Server-Token` in the docs and `X-Postmark-Token` in the code
          # compiles, typechecks, and 401s the first time anybody tries to sign in. The other half
          # is §8.3's omissions — no unsubscribe link, no image, no webfont, no script — every one
          # of which is a thing somebody would add while being helpful and every one of which moves
          # a transactional message towards the Promotions tab.
          npm run test:email
          # AND THE TWO ROUTES, driven as routes through a real Router on a real port, because both
          # properties they are judged on are properties of the ROUTE. §12's criterion 10 is a
          # COMPARISON of two responses — a known address and an unknown one must be
          # indistinguishable, or this is a way for anybody to test whether a given person has an
          # account. And criterion 13 is a CONCURRENT double-click: Gmail's proxy prefetches,
          # Outlook previews, then the person clicks, and exactly one of the three may win.
          npm run test:magic-link
          npm run test:members
          # AND AN INVITATION FROM BOTH ENDS, which `test:members` does not reach: it exercises the
          # membership commands against a workspace somebody is already in, and every failure §12.3
          # asks to be tested is a redemption that must NOT produce one. Revoked, expired, already
          # used, addressed to somebody else, a made-up secret — all five answer 403 with one
          # sentence, deliberately, so that a stolen link learns nothing about which of the five it
          # is. It also covers §13.4's link-for-anybody, whose row stores NULL rather than an empty
          # string: two empty-string invites compete for the one row the partial unique index gives
          # them, and the second silently revokes the first.
          npm run test:invite-flow
          # PER-AGENT ACCESS, AND EVERY GATED COMMAND DRIVEN WITH THE CLIENT BYPASSED. §5 is
          # explicit that the client's copy of the matrix is advisory — "used to hide buttons, never
          # trusted" — so this stands a real relay on a real port and sends the JSON a `curl` would
          # send. Nothing a component could politely refuse on the server's behalf is in the way.
          #
          # ITS TWO LOAD-BEARING ASSERTIONS BOTH LOOK REDUNDANT AND ARE NOT. A grant is refused at
          # write time for exceeding a workspace role, AND a row written straight to the database is
          # intersected down at read time anyway — because write-time validation is correct for
          # exactly as long as nobody's role changes, and the read-time intersection is what makes a
          # demotion bite without anybody rewriting grant rows. And a cross-workspace agent id
          # answers "there is no such agent" on every command rather than refusing: a refusal
          # confirms the id exists, which turns the socket into an enumeration oracle.
          npm run test:access-resolver
          # AND THE ROW THAT IS THE ONLY EVIDENCE A GRANT IS WRONG. Everything else the Access tab
          # records is something somebody DID; `access.denied` records something the system refused,
          # and the person on the wrong end of it does not file a ticket saying their capability is
          # misconfigured — they try, fail, and eventually ask a colleague to do it for them, which
          # is the outcome the whole feature exists to prevent. The suite asserts the row is written
          # per refusal rather than deduplicated, because the PATTERN is the signal — and that a
          # cross-tenant id writes nothing at all, since that branch is reachable by anybody who can
          # open a socket, at whatever rate they choose.
          npm run test:access-denied
          npm run test:relay
          npm run test:channels

      - name: the queue and the sandbox
        working-directory: server
        run: |
          npm run test:redis
          npm run test:jobs
          npm run test:dispatcher
          npm run test:semaphores
          npm run test:worker-loop
          npm run test:chaos
          npm run test:event-bridge
          npm run test:egress-policy
          # THE THREE v0.3.6 CONNECTORS AT THE POINT THEIR HOSTS BECOME A POLICY. Two of them are
          # fixed strings; the third is whatever a workspace typed, which makes it the third SSRF
          # vector after DATABASE_URL and an MCP endpoint. Its load-bearing assertion is the one
          # the spec names — an ALLOWED domain resolving to a private address is refused, because
          # allowed is not the same as reachable and a builder that trusted its own allowlist
          # would make a text field into a metadata-server read. It also holds the two private-
          # range block lists to each other by reading the other language's source: the rule is
          # written twice on purpose (the control plane cannot check a request the sandbox
          # originates, and the sandbox cannot call TypeScript), so drift is what gets tested.
          npm run test:egress-connectors
          # AND THE WHOLE LOOP, which is the suite the others could not be. Each of them tests one
          # seam and passes with the seam either side of it broken — which is exactly how a stored
          # HTTP_AUTH_HEADER reached no run: the panel offered the name, the vault kept the value,
          # the template read it, and nothing in between carried it, under three green suites. This
          # one starts where a user starts and ends where a run starts, through the real database,
          # the real vault, the real manager and the real egress builder, and it is what found the
          # deck rule that made a half-configured connector vanish instead of asking for what it
          # lacked.
          npm run test:connector-loop
          npm run test:database-url
          npm run test:run-tokens
          npm run test:control-plane-routes
          npm run test:backpressure
          npm run test:escape-suite
          npm run test:tenancy-isolation

      # THE SUITES THAT SHIPPED WITH v0.2.15 AND CI HAS NEVER RUN. They were written, they passed,
      # and nothing but the person who wrote them ever executed them — the same gap the client job's
      # comment below describes, in the job that was supposed to have learned from it.
      #
      # THAT COMMENT SAID "THESE TWO", AND ADDENDUM B ADDED ELEVEN MORE without any of them being
      # added here. `package.json` had a script for every one; the workflow had three. So the whole
      # of Addendum B — the secret scanner that decides whether a credential leaves the machine, the
      # provider boundary that decides whose money a stranger's pull request spends, the restack
      # that rewrites which commits a push writes, the eleven live rules — merged on the word of
      # whoever last ran them by hand. A suite that is not in this file is a suite that runs when
      # somebody remembers, which is to say on the days it was least needed.
      #
      # ONE STEP RATHER THAN AN ADDITION TO ONE ABOVE, because none of them needs Postgres or Redis
      # and a reader looking for "what covers GitHub" should find it in one place.
      - name: the two lineages
        working-directory: server
        run: |
          npm run test:github-sync
          npm run test:github-push
          npm run test:github-first-push
          npm run test:github-app
          npm run test:github-app-flow
          npm run test:github-checks-line
          npm run test:check-runner
          npm run test:github-webhook
          npm run test:github-staging
          npm run test:github-trailers
          npm run test:github-workflow
          npm run test:hunks
          npm run test:unpushed-stack
          npm run test:secret-scan
          npm run test:live-diagnostics
          npm run test:semantic-diff
          npm run test:trace-diff
          npm run test:eval-check
          npm run test:check-policy
          # §B.7.2's ratchet, which the Agent diff reads directly: a classification may only be
          # raised by an untrusted signal, and here the untrusted signal is an external commit
          # changing the manifest. It lives with the MCP suites and belongs to this feature.
          npm run test:mcp-impact

      # THE THREADS DESTINATION, in a step of its own from its first suite rather than appended to
      # one above. The comment two steps up is about eleven suites that shipped and were never run
      # by anything but the person who wrote them; the way that happens is a feature whose tests go
      # wherever there is room. A reader looking for "what covers threads" should find it here.
      # THE AGENTS DESTINATION, in a step of its own from its first suite rather than appended to the
      # threads step it is adjacent to. The comment further up is about eleven suites that shipped and
      # were never run by anything but the person who wrote them; the way that happens is a feature
      # whose tests go wherever there is room. A reader looking for "what covers Agents" finds it here.
      - name: the agents destination
        working-directory: server
        run: |
          # The rules behind a card — health, drift, the missing-credential derivation, the runtime
          # resolution. Pure, and therefore the suite that catches the cases a screenshot cannot
          # produce: an agent that is idle AND failing, a deploy AHEAD of the current version.
          npm run test:agent-health
          # And what the grid COSTS. Its one irreplaceable assertion is that the statement count for
          # one agent equals the statement count for forty — an N+1 here is invisible in review and
          # instantly visible in a real workspace.
          npm run test:agent-grid
          # The adversarial pass. Every block in it corresponds to a defect that was in the shipped
          # code — a drift badge on a deploy that failed, a fork offered a slug the constraint held,
          # an archived-only session reading as "not started" — so this is the suite that stops them
          # coming back rather than the one that found them.
          npm run test:agent-adversarial
          # WHERE AN AGENT'S FILES MAY BE READ FROM, which has never run here and which now also
          # holds `runnable`. That boolean was derived from `runtime/agents/<slug>` on the local
          # filesystem — the exact directory this module spends twenty lines arguing is not a valid
          # source of truth for a workspace's own agent — so a fork, a restore on another replica or
          # any deployment with an ephemeral disk reported an agent as unrunnable and blamed a
          # missing `agent.py` the user had no way to supply. Its N+1 assertion is the load-bearing
          # one: the manifest read costs one statement for the whole workspace, or the Agents grid
          # gains a per-agent query that is invisible in review.
          npm run test:agent-files
          # `test:edit-versions` IS DELIBERATELY NOT HERE, and it is the one suite in this file's
          # history whose absence is a reason rather than an oversight. It replays recorded model
          # output, which needs no network — but an apply VALIDATES the generated project, and
          # validation imports it with Python. This job has node and nothing else, so the suite
          # fails at its first apply with "the generated project failed validation and was
          # discarded", which says nothing about the code under test. The two properties v0.3.9
          # needed from it — a manifest copied onto a new version number resolves to nothing, and a
          # restore has to reach the disk as well as the store — are asserted in
          # `test:project-store` and `test:agent-adversarial` instead, both of which run here and
          # neither of which needs an interpreter. Adding uv to this job would buy one suite at the
          # cost of a Python toolchain on every server run.
          #
          # The graph read, which is the one error path in this product that is wired end to
          # end and therefore the template the others follow. Its assertions here are about the
          # SHAPE of the failure: the key travels as its own field so the sentence stays a
          # sentence, because the client's path truncator keeps the last segment and collapses
          # everything before it — a 120-character diagnosis rendered as `.env.example`.
          npm run test:graph-introspect

      - name: the threads destination
        working-directory: server
        run: |
          npm run test:threads
          npm run test:thread-status
          npm run test:thread-channel
          npm run test:thread-binding
          # The agent lifecycle, in the threads step rather than a new one: what it asserts is mostly
          # about what archiving does NOT touch, and the thread still attached to an archived agent is
          # the load-bearing half of that.
          npm run test:agent-lifecycle
          npm run test:thread-title
          npm run test:thread-archive

      # THE INBOX DESTINATION, in a step of its own from its first suite — the same reason the two
      # steps above are separate rather than appended to whichever step had room. A reader looking
      # for "what covers the Inbox" finds it here.
      - name: the inbox destination
        working-directory: server
        run: |
          # The item-type registry, which is where §9's hardest requirement actually lives: every
          # type's resolve condition, tested by resolving it EXTERNALLY. Pure, so all sixteen are
          # covered without standing a server up — and its last assertion is the one that matters,
          # that no predicate is a constant. A predicate stuck at `true` passes every happy-path
          # check above it and makes its item type one that can never appear on a board.
          npm run test:inbox-registry
          # Law 3, which is prose in the specification and a constraint in the database. Forty
          # `record` calls producing one row with `count = 40` is what makes the sentence a claim,
          # and the three assertions beside it are the decisions somebody could reasonably have made
          # the other way: a recurrence starts its age again, a second sweep does not move
          # `resolved_at`, and a per-user patch touches only the column it names.
          npm run test:inbox-store
          # The event-driven generators, whose interesting assertions are all about something NOT
          # happening: opening a trace does not report a tenth failure, a cancelled eval raises
          # nothing, an eval's own failed runs raise no failure card, and the one payload field that
          # grows has a cap on it. Every one of those would look right in a screenshot.
          npm run test:inbox-generators
          # The sweep, and the four properties §6.2 names: idempotent, constant in the number of
          # agents, safe against concurrent replicas, and cross-workspace isolated in BOTH
          # directions. The last is why this suite exists at all — §6.3 calls the reconciler the
          # highest-risk code in the feature, because it is the one path that legitimately touches
          # many workspaces, and "a pass for A cannot resolve an item in B" is not a property a
          # single-tenant test can observe.
          npm run test:inbox-reconciler
          # The derived generators, and the round trip that is the reason the suite exists: a
          # trigger and its resolve predicate live in two files, so the failure mode is a rule that
          # raises what the predicate immediately resolves — a card appearing and vanishing on every
          # sweep — or one nothing can clear. Both look correct in review. It also holds the
          # exclusion v0.1.9 paid for: an agent with no pricing is out of anomaly detection
          # entirely, and never a $0 baseline that everything spikes against.
          npm run test:inbox-derive
          # §3's three verbs, whose whole point is that they are three. Collapsing any two is the
          # failure the specification spends a section preventing: a dismissal that resolved would
          # clear a teammate's board, and a snooze that vanished would be a slower dismissal. It
          # also holds the badge rule, which the specification asks nobody to "fix": blocking plus
          # proposals only, because a badge that never reaches zero is one people learn to ignore.
          npm run test:inbox-snapshot
          # Undo, which is why this surface has no confirmation dialogs and therefore has to work.
          # Its load-bearing assertion is that undoing a dismissal restores the PRIOR value rather
          # than clearing the column: an item dismissed last week and dismissed again today has two
          # dismissals and one column, and clearing it would put the card back on a board somebody
          # had deliberately cleared. Plus the seeds, which must be written once and never again.
          npm run test:inbox-actions
          # §6.5's own requirement, built the way `test:log-redaction` is: one known secret, and
          # every route into a payload tried against it. A payload is a sink in exactly the sense a
          # log is — stored, broadcast to every socket in the workspace, and outliving the problem
          # it describes — and it carries one thing a log does not, a build's own error text from a
          # process that had the credentials in its environment.
          npm run test:inbox-payload

      # THE ACTIVITY DESTINATION, the fourth and last of the sidebar's tabs, in a step of its own
      # from its first suite — the same reason the three steps above are separate rather than
      # appended to whichever step had room. A reader looking for "what covers Activity" finds it
      # here, and a suite added to this feature has an obvious place to go.
      - name: the activity destination
        working-directory: server
        run: |
          # The one window every figure on the tab describes. Pure, because every rule in it looks
          # right in a screenshot and is wrong in the case nobody had: a previous window that reaches
          # back before the workspace existed, a custom range somebody inverted, a bucket boundary
          # nobody could name. Cross-highlighting is only coherent because all four modules share
          # this, so a drift here is four modules quietly describing different days.
          npm run test:activity-range
          # §2's four honesty rules, every one of which is a bug this product has already shipped
          # once and every one of which fails SILENTLY — the number is present, plausible and wrong
          # on a card built to be screenshotted. A crashed run still spent money on its completed
          # steps; cache reads bill at the cached rate; an unpriced model is unknown and never $0;
          # and cost is summed from what was spent, never from `runs.cost`. The fixture leaves that
          # column at zero on purpose, so a query that read it fails here rather than in production.
          npm run test:activity-spend
          # §4's definitional care, which matters because these figures get quoted. A paused-and-
          # resumed run is ONE run; a branch is one run that does not inherit its copied prefix's
          # seconds; a run a restart or a cancellation closed out is not a failure. Every one of
          # those is a count that looks right until you know the case, and the last of them would
          # report a deploy bouncing the server as the workspace's agents being broken.
          npm run test:activity-health
          # §3.1's pulse band, whose load-bearing assertion is that its columns SUM to the hero row
          # above them — a chart that disagreed with the figure over it would be two answers to one
          # question on one screen. The bucketing groups by a date grain in SQL because `substr` is
          # the only date arithmetic both dialects spell identically, and the fold from grain cell
          # to column is exact only because the grid is epoch-aligned. An unaligned one loses the
          # partial first column's rows silently, which is what this suite caught while it was
          # being written.
          npm run test:activity-pulse
          # §5.2 in one assertion: the statement count for a leaderboard load is the same for one
          # agent as for forty. A leaderboard is the most natural place in the whole product to
          # write an N+1 — every row wants a per-agent figure — and an N+1 here is invisible in
          # review and instantly visible in a real workspace. The rest of the suite holds the rows
          # to the strip above them: a table whose rows do not add up to the headline is the
          # fastest way to make somebody stop believing both.
          npm run test:activity-leaderboard
          # §6's two shares, which disagree on purpose — a cheap model is most of the volume and a
          # tenth of the bill — so a mix that reported one number would answer half the question.
          # The load-bearing assertion is the DENOMINATOR: an unpriced model stays in the volume
          # view and out of the spend one, and its zero stays out of the spend total, or the priced
          # segments sum to all of a bar that is a fifth full and the gap reads as a model nobody
          # named.
          npm run test:activity-model-mix
          # §5.2's keyset, tested the only way it can be: scroll a page, INSERT ROWS ABOVE THE
          # CURSOR, scroll again. That is what an offset gets wrong and gets wrong silently — by
          # repeating rows it already showed and skipping ones it never will — and this feed is
          # written to on every run, every deploy and every step. The union is derived rather than
          # a table, so nothing new is recorded for this tab and no feed row can disagree with the
          # trace it links to.
          npm run test:activity-feed
          # §8 in one line: "include failed deploys — a release log that only shows successes is a
          # marketing page". Filtering to what is live produces a tidier timeline that hides the
          # Tuesday three agents went out and two of them failed, which is the exact view the
          # per-agent Deploy panel cannot give. The URL is guarded the way the Agents card guards
          # its drift badge: only on a deploy that is actually serving.
          npm run test:activity-releases
          # §9's four numbers, none of which has a column. The confirmation rates are read off the
          # steps the gate raised on — nothing records a confirmation being answered — and the
          # truncation rate off a marker the Python runtime writes into the result. Both are
          # cross-language couplings, so the suite asserts the strings against the runtime's own
          # mcp_bridge.py rather than against a copy: if a phrase changes there, a rate silently becomes
          # zero, and this is what goes red instead.
          npm run test:activity-tools
          # §10, and the suite asserts an ABSENCE as well as the numbers. Three of the five columns
          # the specification names are attributable in this schema and two are not — nothing
          # records who started a run or who pressed deploy — so the card shows what is recorded
          # and says what is not. A zero beside somebody's name is a claim about that person; an
          # absent column is a claim about the schema, which is the true one. The streak has to end
          # TODAY, or it is a count of active days wearing the wrong word.
          npm run test:activity-team
          # §5.3's cache and its four rules, plus the one that is not in the specification. Ten
          # sockets connecting at once against a cold cache launch ten identical thirty-day scans
          # in the same millisecond, and a cache of RESULTS cannot stop it — by the time the first
          # finishes the other nine are running. Storing the in-flight promise is what makes the
          # tenth caller await the first's work, and the clock is injected so a sixty-second TTL is
          # asserted rather than slept for.
          npm run test:activity-cache
          # §6's own requirement, built the way `test:log-redaction` is: one known secret, and every
          # route into a payload tried against it. A payload is a sink in exactly the sense a log is
          # — stored, broadcast to every socket in the workspace, outliving what it describes — and
          # this one carries a deploy's own error text from a process that had the credentials in
          # its environment. Both directions are asserted: genuine secrets out, and v0.2.4's
          # narrowing kept, because a redacted MODEL NAME on this tab deletes the answer.
          npm run test:activity-payload

      # THE DESKTOP WRAPPER, in a step of its own from its first two suites — the same reason the
      # four destination steps above are separate rather than appended to whichever step had room.
      # A reader looking for "what covers the desktop app" finds it here.
      #
      # NEITHER SUITE NEEDS RUST, AND THAT IS THE POINT OF BOTH. The wrapper is Rust, its
      # configuration is JSON, and the half that runs in a page is TypeScript — so every
      # interesting failure is at a seam between two of those, where nothing typechecks anything.
      # An event name spelled one way in deeplink.rs and another in deepLink.ts compiles, passes
      # every existing check, and produces a feature that silently does nothing.
      - name: the desktop wrapper
        working-directory: server
        run: |
          # The seams, read as text across three languages: the scheme, the event name, the
          # sidecar's name and argument vector, the port default, the credential keys, the window
          # label. Its load-bearing assertion is the last one — every environment variable the
          # shell sets is grepped for in the server's own source, because the rule this work was
          # done under is that the wrapper adapts to Jaroku, and a variable invented in the shell
          # would be a change to the server wearing a disguise.
          npm run test:desktop-contract
          # And the live half: index.ts spawned as a SUBPROCESS with the shell's own argument
          # vector and environment, then driven through the three-request exchange and a real
          # socket. It found the gap it exists for while it was being written — a packaged
          # webview's origin is tauri://localhost and the development allowlist has never heard
          # of it, which nothing typechecks and whose symptom is a window that opens and never
          # connects. The refusal beside it is what stops the assertion passing on a server that
          # admits everybody.
          npm run test:desktop-smoke
          # And the supervisor, which is the half neither of the other two could see. The largest
          # single cause of the desktop app freezing was that `ports.rs` proved a port free by
          # binding `127.0.0.1` while `wsRelay.ts` binds the wildcard — two claims Windows lets
          # both succeed — so a port a previous session's backend was still holding read as free,
          # and the supervisor then re-used that same number on all three restarts. This suite
          # binds real sockets to demonstrate the platform behaviour on whatever runner it is on,
          # then asserts the Rust asks the question the relay asks, resolves it per attempt, and
          # ends the process TREE rather than the launcher tsx spawns the server from. The crate
          # has better tests for all of it and they cannot run here: `tauri-build` needs a staged
          # Node sidecar that `git ls-files` does not track.
          npm run test:desktop-supervisor

      - name: cost, abuse and the data lifecycle
        working-directory: server
        run: |
          npm run test:pricing
          # REASONING EFFORT, AND THE ONE FAILURE MODE THAT IS COMFORTABLE. The composer spec's
          # §3.2 says "Degradation is visible, not silent" and "Never report an effort that
          # wasn't used" — two statements of the same rule, because the way this breaks is a
          # request that quietly downgrades while the UI keeps reporting what was asked for.
          # Nothing errors, nothing looks wrong, and somebody believes they paid for XHigh
          # reasoning on every turn for a month. The suite constructs a reasoning_effort-shaped
          # model rather than adding one to the shipped price sheet, because the clamp branch is
          # otherwise unreachable — and a criterion that passes without executing a line of its
          # subject is the worst kind of green.
          npm run test:effort
          # WHAT A CONVERSATION IS SET TO, and §7's refusal to backfill a row per conversation.
          # The failure is silent: a conversation frozen at whatever the default was on the day
          # somebody touched an unrelated setting still WORKS, it just stops following the
          # workspace, and nobody finds out until an admin changes the default and half the
          # threads ignore it. It also holds §3.2's pin, which is a security rule wearing a
          # settings hat — a pin a conversation can opt out of is a suggestion.
          npm run test:conversation-settings
          # ...and the routes over it, where three of the four interesting answers are policy
          # rather than validation: another workspace's conversation is 404 and never 403 (a 403
          # confirms the id exists, which makes the route an enumeration oracle), a pinned
          # workspace refuses with 409 rather than accepting a write the resolver would then
          # ignore, and the response is the EFFECTIVE settings rather than an echo of the
          # request. Plus the audit row §3.2 requires, carrying BOTH values — "set to Fast" does
          # not distinguish somebody relaxing Strict from somebody re-saving, and the first is
          # what the row exists to make findable.
          npm run test:conversation-routes
          # THE PERMISSION SHIELD'S TWO HARD INVARIANTS — §12.7 and §12.8. Both are written as
          # things somebody verifies by bypassing the UI, and the second has already failed once
          # here in exactly the way it names: a block-list entry assembled with `join` read
          # toolsmcp_bridge.py on Windows, matched the local paths one code path produced, and
          # matched nothing in the object store — so the list went quietly empty for the one file
          # that carries an agent's entire MCP grant. It never failed on Linux, where the
          # separator happens to agree, which is why every spelling of that path is asserted
          # rather than the canonical one. The other half is that Fast still confirms a write:
          # once that invariant holds, Fast is deliberately a small mode, and a change that made
          # it a large one would fail here rather than in production.
          npm run test:permission-shield
          # THE ATTACHMENT BUDGET — §12.15: "Exceeding the context window blocks send and names
          # the offending attachments — never truncates silently." The failure it guards has no
          # symptom at all: an over-budget request does not error, the provider takes what fits
          # and answers confidently about half a file. So the assertions are mostly about the
          # arithmetic leaning the right way — an estimate that came in LOW would let exactly
          # that request through, which is why the estimator is deliberately pessimistic about
          # source code and why that pessimism is checked rather than assumed.
          npm run test:attachments
          # RESPONSE VARIANTS — §12.21 and §12.22. The first has a comfortable failure: a store
          # that updated a turn in place looks completely correct while ONE response is on
          # screen, and is only wrong when somebody compares two — at which point the metadata
          # row, whose whole job is answering "which model wrote this?", answers with whichever
          # model ran last. The second is not a wrong pixel at all: if switching a view moved
          # the published pointer, reading a response would be deploying one, so the suite
          # asserts the store has no publish path to reach.
          npm run test:turn-variants
          # NOTES, PINS AND FEEDBACK — §12.18, §12.19, §12.20 and §12.23. Two of these are the
          # same question with opposite answers, which is the whole reason both features exist:
          # a note is SHARED and a pin is PERSONAL. Neither failure produces an error and both
          # look completely correct to whoever is testing alone — a note that turned out to be
          # private is a warning a teammate never sees, and a pin that turned out to be shared is
          # a rail full of somebody else's bookmarks. The suite also holds §12.19, which is
          # really an assertion about the schema: notes hang off the TURN, so there is no column
          # that could point at a variant and make them vanish on a regeneration.
          npm run test:turn-interaction
          npm run test:plans
          # The entitlement resolver, and the audit that is the reason it is a suite rather than a note.
          # It reads wsRelay.ts for every command the relay accepts and fails on one that has neither a
          # check nor an explicit "none" — the same shape test:capabilities uses, against the failure that
          # actually happens: a command added next year, absent from the table, unlimited on every tier
          # forever, with nothing anywhere saying so. Its second audit is subtler and matters more —
          # requireEntitlement ALLOWS a kind that has no limit behind it, which is right for a check nobody
          # wrote and a bypass for one somebody meant to.
          npm run test:entitlements
          # THE PAYMENT PATH, WHICH HAS EXISTED SINCE v0.1.9 AND HAS NEVER RUN HERE. It was registered in
          # package.json and absent from this file, which is the same as not having it: the signature check
          # is the only thing between "Stripe says this workspace paid" and "anybody who can reach the URL
          # says so", and the state machine below it decides who keeps a paid plan through a failed
          # renewal. It also now holds the desktop rule the whole checkout hop rests on — a return URL
          # must be an https page a browser can reach, because Stripe would accept a plain-http one.
          npm run test:stripe
          # And the three web pages, which are the only Jaroku surfaces on the open web and the ones
          # nobody opens between releases. Two rules: the pricing page sells nothing — every CTA is a
          # download, so there is one place that has to get webhook linking and workspace association
          # right rather than two — and the return pages land the browser back in the app rather than
          # leaving somebody in a tab wondering whether they were charged. It also holds the success
          # page to what it actually knows: a payment was received, not that a tier moved.
          npm run test:checkout-surfaces
          npm run test:metering
          # The counters a TIER is bounded by, which are quantity rather than money. Every assertion in it
          # is about a number that would look right on a screen: a run is counted where status first
          # becomes running — not on receipt, where a refused request was never a run, and not on
          # completion, where a crashed run that spent real model calls would be free. And ONCE, proved
          # against two instances rather than one, because the guard has to be the unique key and not a
          # Set: pausing to think must not cost a run, and two replicas watching one start must agree.
          npm run test:usage-periods
          # The platform key POOL, and the assertion it exists for: an exhausted pool refuses rather than
          # queues. A queue would pass every other check here and turn a capacity problem into a latency
          # one no graph shows — flat error rate, slower runs, and the first anybody hears is a complaint
          # about speed weeks later. Beside it, the cooldown: a 429 means busy rather than broken, so a
          # pool that REMOVED keys drains to empty over one busy hour with every symptom pointing at the
          # provider.
          # The three gates in front of the pool, which have never run here either: the kill switch, the
          # plan, and the per-workspace ceiling on what WE pay. It is the one place in this system where
          # the platform's money is spent by somebody else's decision.
          npm run test:platform-key
          npm run test:key-pool
          # BYOK, which has existed since v0.1.9 and has never run here either: a workspace's own provider
          # key must reach its own run and nothing else, and the toggle that chooses between its keys and
          # ours is the one control that changes what a paid plan actually costs.
          npm run test:byok
          # And the batching, which is not an optimisation. Stripe rate-limits usage records, so per-call
          # reporting loses them under exactly the load that makes reporting matter — and a dropped usage
          # record is revenue that never happened, with no error, no failed run, and nothing to notice
          # until a reconciliation months later. Its load-bearing assertion is that a failed flush KEEPS
          # its rows: take-post-forget loses the batch precisely when the post fails.
          npm run test:usage-reporter
          npm run test:balances
          npm run test:gate
          npm run test:aggregate
          npm run test:abuse-signals
          # The three spend caps, and the assertions are mostly about what must NOT trip. A cap that
          # catches abuse and also catches Tuesday is one somebody switches off in week two, at which
          # point it protects nothing: the anomaly rule must not fire on a first hour of work where the
          # trailing average is a rounding error, the runaway cap must not exist on a plan including
          # nothing (zero times two is zero), and a workspace whose age could not be read must not be
          # frozen on a failed lookup.
          npm run test:spend-caps
          npm run test:enforcement
          npm run test:edge-rules
          npm run test:partitions
          npm run test:retention
          npm run test:workspace-export
          npm run test:deletion
          npm run test:log-redaction
          npm run test:tracing
          npm run test:metrics

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm run typecheck
        working-directory: client

      # THE CLIENT HAS NINE SUITES AND THIS JOB RAN NONE OF THEM. It typechecked and stopped,
      # which is a check that the types agree and no check at all that the code works — every one
      # of these existed, passed, and had never been run by anything but the person who wrote it.
      #
      # `test:reset` is the reason this is not a tidy-up. The server can be flawless — every query
      # scoped, every broadcast filtered, RLS behind all of it — and the app can still show one
      # workspace's runs under another workspace's name, because the browser kept them. That is a
      # cross-tenant leak in the UI, and it is the one the spec names in "things that will bite
      # you". Its second assertion reads the store directory and fails on a store that is neither
      # reset nor excluded, so it catches the leak that actually happens: not in a store somebody
      # tested, but in the one added six months later that nobody wired in. A rule like that is
      # worth exactly as much as the number of times it runs.
      #
      # The server's suites are one `run:` per group; these are one step, because they are quick
      # and none of them needs a service.
      - name: the client's own suites
        working-directory: client
        run: |
          # typography.pdf's ladder, and the two rules about which face carries what. It is here
          # rather than further down because most of what it asserts is a property of the WHOLE
          # client — no call site writes its own pixel size, no `text-` class names something
          # Tailwind will not emit, the mono face reaches only the files that are about code — and
          # a rule like that is worth what it can be broken by, which is any of three hundred
          # files. It found one the first time it ran: a copy button whose failed state asked for
          # `text-error` against a palette whose red is `err`, so the one state that had to be
          # noticed rendered with no colour at all and had done since it shipped.
          npm run test:type-scale
          # colour_system.pdf's palette, beside the ladder above it and for the same reason: most of
          # what it asserts is a property of the WHOLE client. Its load-bearing half is an ABSENCE,
          # which is the shape a palette bug actually takes — a hex literal does not fail when the
          # system moves under it, it just stays the colour it was while everything around it
          # changes, and only a person looking at the screen can see that. Forty-eight of those were
          # in the client before this pass: nine in the graph view, four in the Inbox, one in the
          # thread glyphs. The one it exists for most is `CodeViewer`'s syntax theme, which writes
          # its own background into the markup and which no token, class or variable can reach.
          npm run test:colour-system
          npm run test:reset
          npm run test:thread-store
          npm run test:thread-cost
          npm run test:thread-groups
          npm run test:thread-filter
          npm run test:thread-resume
          npm run test:thread-archive
          npm run test:secrets-store
          # The guard that decides whether a value off the socket becomes an upsell card. A cast instead
          # of a check renders "undefined of undefined used" over an Upgrade button, which is worse than
          # the plain error string it replaced because it looks like a number somebody could act on. Its
          # load-bearing assertion is the asymmetry: a quota refusal without its figures is refused, and a
          # feature refusal without them is correct — "GitHub is not on Free" is not zero of zero.
          npm run test:entitlement-store
          # THE AGENTS TAB'S FOUR PURE MODULES. Every one of them is a rule that looks obviously right
          # in a screenshot and is wrong in the case nobody had that day, which is exactly the kind of
          # thing a suite that only runs when somebody remembers does not catch.
          #
          # `test:agent-context` is the load-bearing one: the block it checks goes on a CLIPBOARD and
          # from there into an issue tracker, so it asserts by the same pattern the log-sink suite uses
          # that no secret value can reach the output.
          npm run test:agent-art
          npm run test:agent-tags
          npm run test:agent-filter
          npm run test:agent-context
          # THE INBOX BOARD'S ARRANGEMENT RULES, which are the same kind of thing as the four above:
          # each one looks obviously right in a screenshot and is wrong in the case nobody had that
          # day. The age bar is logarithmic because a linear one over a week makes the first hour —
          # the period a triage surface is about — invisible; the tray never renders a negative
          # duration; and a shift-click range works upwards, which is the half nobody tries first.
          npm run test:inbox-board
          # THE ACTIVITY TAB'S METRIC REGISTRY, which is the same kind of thing again. §3.3 is
          # explicit that there is no global "up is bad" rule and that applying one would make the
          # page lie — spend up is bad, tokens up is neutral, latency down is good — so the only
          # thing between this dashboard and a wrong verdict is that each metric declares its own
          # polarity and every badge reads it. The other half is §3.5: unknown renders `--` for
          # every unit, never `0`, never `$0.00`, which is the rule v0.1.9 paid for once already.
          npm run test:activity-metrics
          # §4's rule, which is not a thing anybody breaks on purpose: "extend actionIcons rather
          # than defining a second icon for an action that already has one". A second registry is
          # what happens when a new surface needs a verb the old table lacked and the easy fix is a
          # table beside it. Nine feed kinds mapping onto the existing eleven is the claim, and the
          # load-bearing assertion is that a confirmation row and the trace row that produced it
          # read identically — same icon, same verb, same accent.
          npm run test:action-icons
          # §6 asks for the feed virtualiser to be checked "at ten thousand rows, not at fifty", and
          # the reason it names the number is that fifty rows pass every version of this code
          # including the one that renders all of them. The three things the naive window gets wrong
          # are all here: overscan on one side only (scrolling up flickers, which is the direction
          # nobody tests), no clamp at the end (empty rows that read as "more is coming"), and a
          # pixel fetch threshold that is eight rows on a desktop and two on a phone.
          npm run test:feed-window
          npm run test:auth
          # What a HOST may tell this bundle at runtime, which is one fact — where the backend
          # actually ended up listening — and every assertion in it is a refusal. A host that
          # says nothing, a host that says something malformed and a host that is not there have
          # to produce the same outcome, because that outcome is the build-time default and the
          # build-time default is a working application. Anything else is a socket URL nothing
          # answers, whose symptom reads as "the backend is down" and sends whoever is debugging
          # it to the wrong half of the system.
          npm run test:host-config
          # And what a host says while the page is already open, which is the half that was
          # missing. Every way a desktop launch can fail reached the page as one fact — the socket
          # did not open — so it rendered "disconnected, retrying" for five different causes, in
          # none of which anything was going to answer. The interesting assertions are the
          # refusals, for the reason above, and the ORDERING: the shell settles its status before
          # React mounts, so on exactly the launches this exists for an event alone reaches
          # nobody, while a snapshot alone can arrive after and overwrite a recovery.
          npm run test:host-backend
          # `jaroku://`, parsed in the client rather than in the desktop shell — a rule that can
          # only be exercised by building and launching a desktop app is a rule nobody exercises.
          # Every URL it sees came from OUTSIDE the application, since any program on the machine
          # can open one, so the interesting half of the suite is refusals. Two of them exist
          # because the platform URL parser was checked rather than trusted: it resolves `..`
          # away for `jaroku://host/path` and does NOT for the slashless form or for `..%2f`.
          npm run test:deep-link
          # And what ONE of those links means, which is the auth specification's own question
          # rather than the parser's. Its refusals are the near-misses — `auth/completed`,
          # `auth/complete/extra`, `auth` alone — each a shape this application never produces and
          # each accepted by a reader that matched on a prefix. The other half is §4.5's queue: the
          # OS starts the app WITH the URL when it is not running, so a callback arrives before
          # first-run has finished and before any screen could spend it. Delivered synchronously
          # the moment one can, and exactly once — a ticket redelivered after a failed exchange is
          # a "that link expired" somebody sees twice for one click.
          npm run test:auth-link
          # WHAT A HOST MAY SAY ABOUT SETTING THE MACHINE UP, and every assertion in it is a
          # refusal — the same shape `test:host-backend` takes and for the same reason. A mismatch
          # here does not error: the client refuses a progress whose steps it does not recognise,
          # deliberately, so a step renamed in Rust alone produces a setup screen that never
          # appears and a launch that looks exactly like the freeze this feature was written to
          # end. The subtlest assertion is that `required` is decided ONCE from the marker file —
          # the four steps run on every launch, and a page that rendered them because one was
          # briefly in flight would greet a returning user with a setup flow for a machine they set
          # up months ago.
          npm run test:auth-first-run
          # AND THE CLIENT'S HALF OF SIGNING IN, which is mostly about ONE VALUE. The nonce binds a
          # sign-in to this window, and `jaroku://` is a scheme any program on the machine can
          # register — so it is what makes an intercepted deep link useless, and only because it
          # never leaves this process's memory. So the suite installs a localStorage that records
          # every write and asserts the nonce is never among them: the same shape
          # `test:session-vault` uses for the token, against the mirror-image mistake. Beside it,
          # the refusals that decide what the screen says: a 401 on an exchange is an expired link
          # with a way back, a 500 is ours, and an unreachable server is neither.
          npm run test:auth-sign-in
          # §5S STEP ARITHMETIC, which is pure and is therefore the only reason these rules get
          # exercised at all — a resume that could only be checked by closing a desktop app
          # mid-flow and reopening it is a rule nobody checks. Two of them matter most. The
          # engagement threshold is step 3, and both directions of getting it wrong are real: too
          # low and closing the window on the welcome screen marks somebody onboarded forever;
          # too high and somebody who finished is walked through it all again. And the first
          # name, whose failure mode is not a crash but "Welcome, ada.lovelace+jaroku" on the
          # first screen anybody sees after signing up.
          npm run test:account-onboarding
          # §5.1 STEP 3S KEY, and mostly §5.3s "already saved is not re-collected". The three
          # names are the first half: a key stored as GEMINI_API_KEY and read as GOOGLE_API_KEY
          # produces an onboarding that reports success, a Secrets tab that shows a connected
          # provider, and a first run that cannot authenticate — with nothing anywhere saying the
          # two differ. The second half is about a failure that looks like success: whether a
          # provider reads as Connected decides whether somebody is sent PAST the screen that
          # would have set a key, so a locked vault, an unreachable server and a malformed body
          # all answer with nothing rather than guessing.
          npm run test:provider-keys
          # §5.1 STEP 4, AND THE FAILURE IT IS ONE LINE AWAY FROM HAVING. That screens button
          # advances to "Youre all set" the moment it resolves, so anything failing quietly
          # there congratulates somebody and leaves them with an empty app and no way to tell
          # why. Three things can: a closed socket, a socket that LOOKED open and was not, and a
          # workspace with no sample agent to select. `send` returns false on the second and
          # every other caller in socket.ts legitimately ignores that — they are composers inside
          # a connected app where a dropped frame is a reconnect somebody can already see. This
          # one cannot, which is why `sendPlanAgent` is the single sender in the client that
          # reports whether it sent. It also asserts the command is planAgent rather than
          # generate: a generate would work, produce an agent, and skip the plan card the step
          # exists for.
          npm run test:first-agent
          # WHERE THE SESSION TOKEN GOES, and the assertion the suite exists for is where it does
          # NOT. Under a host with an OS credential store the token must never touch
          # localStorage, and a mirror is the easy implementation that leaves the protection
          # notional while making it look real — the keychain fills up correctly and the token is
          # still in a file any program running as this user can open. So the suite installs a
          # localStorage that records every write and asserts it stays empty for the whole host
          # section, while checking the round trips to the store really happened.
          npm run test:session-vault
          # The two ends of an invitation link. The failure it exists for is silent and partial: an
          # unencoded token produces a link that works for most secrets and fails for the ones with
          # a `+` or a `/` in them, with "that invitation is not valid" as the only symptom.
          npm run test:invite
          npm run test:plan-flow
          npm run test:deploy-store
          npm run test:note-kind
          npm run test:inline-code
          npm run test:title
          npm run test:export
          npm run test:csv
          # Both arrived with v0.2.15 and neither was added here, which is the exact omission the
          # comment above is about. `test:truncate-path` guards the rule that a filename survives
          # the width and the middle of the path is what gives way — a right-edge fade makes
          # tools/we and tools/tr the same string to anybody scanning a list. `test:composer-
          # triggers` guards #, @ and ! firing only where they are a trigger, and the case that
          # matters is the one that is not: a picker opening halfway through somebody's email
          # address is worse than having no shortcut at all.
          npm run test:truncate-path
          npm run test:composer-triggers
          # THE ICON REGISTRY, and it is here for a failure a typecheck cannot see. Hugeicons
          # numbers some glyph families and the numbers move between releases; a renamed export
          # arrives as `undefined` rather than throwing, the renderer draws an empty `<svg>`, and
          # the composer quietly loses a control. So the suite asserts every one of §2.1's twenty
          # tokens resolves to real path data — which is what turns a silent blank square in the
          # control bar into a named failure on the upgrade that caused it.
          npm run test:icons
          # AND THAT EVERY BUTTON DOES SOMETHING, which is the sibling failure to the one above:
          # `test:icons` catches a control that lost its GLYPH, this catches one that never had a
          # HANDLER. Share sat in the top bar — the strip on every surface of the app — enabled,
          # focusable, in tab order, with a tooltip reading "not available yet" as the only signal.
          # A button with no onClick typechecks, renders, and passed every suite there was. The
          # principle was already written down twice in the client's own comments and neither
          # statement had a check behind it.
          npm run test:dead-controls
          # AND WHICH MARK A TOOL FILE GETS, which is a table of regexes and is therefore an
          # ORDERING — one that looks obviously right in any arrangement and typechecks in all of
          # them. The mapper runs on every tool path including the bespoke ones a model names, so
          # its inputs are `mail_to_calendar.py` and `stripe_api_client.py` rather than the six
          # connectors somebody reviewed. A wrong order is not a crash or a blank square: it is a
          # Gmail envelope on the calendar tool of the one workspace that has both connectors and
          # for which telling them apart is the entire point of the icon.
          npm run test:graph-icons
          # WHERE EACH COMPOSER CONTROL SITS, which §12 states as two acceptance criteria written
          # as things somebody checks by resizing a window — 1c, that hiding a control moves no
          # other control, and 1d, that the bar never wraps and the right three collapse into the
          # ⋯ below ~560px. Both have a wrong answer that stays invisible until the day somebody
          # switches to a model with no reasoning control, by which point the bar has been
          # reviewed a dozen times at one width. So the rules live in a pure module and the suite
          # holds them, rather than living in a class string nobody can assert against.
          npm run test:composer-bar
          # THE CONNECTOR DECK'S LAYOUT — §12.9: "1/2/3 render as tiles; 5 renders 3 tiles + +2;
          # a disabled connector renders grayscale and stays in the deck." Every clause has a
          # wrong answer that looks fine on the one workspace somebody tested with: three
          # connectors is the common case and the case where nothing is exercised — the counter
          # never appears, the stacking order is unnoticeable at that width, and a deck that
          # shrank when you switched something off is indistinguishable from one that did not.
          # That last clause is the one most likely to be "simplified" away, and the spec
          # pre-empts it: an absent connector reads as a workspace disconnection, which is the
          # one thing this toggle deliberately is not.
          npm run test:connector-deck
          # THE METADATA ROW'S ORDER — §12.24: "Metadata row order is stable; absent items
          # collapse without reordering the rest." The failure is not a crash and not a wrong
          # value: it is the duration sitting in a different place on a turn that produced code
          # than on one that did not, and §6.5 gives the reason it matters in one sentence —
          # "people learn the position of the thing they check most". Reordering on availability
          # is also the natural thing to write, so the suite checks every combination of
          # absences rather than the three the spec happens to name.
          npm run test:turn-metadata
          # §14.1'S FOUR CLIENT SUITES, and the reason they are one group is that they are one
          # feature: a workspace you can be in more than one of. `test:workspace-switcher` holds
          # the arrangement rules — a personal workspace first, teams alphabetical by a comparison
          # that knows "acme co" sorts before "Zebra" and that Å belongs beside A — and the render,
          # which is where a role badge on a personal workspace or a hardcoded plan chip shows up.
          #
          # `test:workspace-switch` IS THE LOAD-BEARING ONE. §5 calls the transition the hardest
          # section in its specification and every property it names is an ORDERING: the old socket
          # closed before the new one opens, the stores emptied before anything can refill them, a
          # ticket for A unable to open a socket for B. None of those is visible in a screenshot of
          # a switch that worked — the stores look empty because the new snapshot replaced what was
          # on screen, not because anything cleared — so the suite asserts against a transcript of
          # what the fake socket and fake network were actually asked to do. Its last assertion in
          # every block is that nothing from workspace A survived into workspace B, which is a
          # cross-tenant leak in the UI and the one failure the server cannot prevent.
          #
          # `test:join-flow` is the paste box: a full invite URL, a bare token, and the truncated
          # paste that is the case the refusals exist for. `test:permission-ui` reads the SERVER's
          # capabilities.ts as text and fails when the client's copy has drifted in either
          # direction — §8.1 says a copy "guarantees they match", and this is what makes that true.
          npm run test:workspace-switcher
          npm run test:workspace-switch
          npm run test:join-flow
          npm run test:permission-ui
          # THE ACCESS TAB, AND EVERY ASSERTION IN IT IS ABOUT A SENTENCE OR AN ABSENCE. Nothing
          # this suite checks could stop anybody doing anything — the enforcement is the server's,
          # and `test:access-resolver` holds that. What it checks is whether the panel tells the
          # truth about what is already true, which is where this surface fails silently: a
          # provenance line saying "granted here" about access nobody granted sends an admin to
          # revoke a grant that was never the reason, and a capability the role has capped away
          # rendered as though it worked reads as a grant that is doing something.
          #
          # Its render half asserts ABSENCE rather than a `disabled` attribute, because §8 rules
          # out disabled AND hidden for an affordance a role cannot use — a suite that accepted
          # either would pass on the two shapes the rule exists to forbid.
          npm run test:access-tab

  # THE PYTHON SIDE, WHICH THIS FILE HAS NEVER RUN. Two jobs above it check the two halves
  # written in TypeScript; the connector templates are Python, and the two verifications built to
  # guard them — `check_catalog()` and `check_failures_raise()` — are invoked by no workflow, no
  # script and no npm target. The README tells a contributor to run the first "when adding a
  # connector", ADR-014 repeats it, and CONTRIBUTING describes what it refuses. Three documents
  # describing a check that ran when somebody remembered, which is to say on the days it was least
  # needed — the same gap the two comments in the server job are already about.
  #
  # NO SERVICES AND NO EXTRAS. Every suite here fakes its SDK into `sys.modules` before the
  # template's lazy import runs, so the base install is enough and nothing reaches a network. That
  # is not only speed: a suite that needed `--extra connectors` would be a suite that skips on the
  # machines least likely to be checking, and one that needed a real Stripe key could not run here
  # at all.
  runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: runtime/uv.lock
      - name: the connector catalog's own verifications
        run: npm run test:connector-catalog

      - name: the connector templates
        run: |
          # Half of what is worth asserting about a template is what it SENDS: that a listing
          # expands recurring series, that a cap a caller argued past is clamped before the
          # request leaves, that an update merges onto the current event rather than replacing
          # it. A recorded response can say nothing about any of those, so the SDK is a fake
          # that records every call — and is BLOCKED by a meta-path finder for the
          # missing-dependency assertion, or that one would pass here for a reason that has
          # nothing to do with the code and quietly stop testing anything on a machine with the
          # extra installed.
          npm run test:connector-gcal
          # THE READ-ONLY ENFORCEMENT IS A SCAN OF THE FILE, not an attempt to mutate. The way
          # "this connector cannot charge anybody" stops being true is a seventh tool or a fourth
          # branch, and neither exists to be called until somebody has already written it — so
          # every call the template makes on the SDK is found in its own syntax tree and its
          # method name must be retrieve, list or search. The tree rather than a substring,
          # because `getattr(sdk.Refund, verb)(...)` passes a text scan and IS the vulnerability.
          # The scanner is then re-run against snippets that violate each rule, because a check
          # nobody has watched refuse anything might be stuck at true.
          npm run test:connector-stripe
          # THE ADVERSARIAL ONE, and most of its assertions are about requests that must NOT
          # happen — counted rather than read, because a message saying "refused" while a socket
          # was opened passes a text check. The template's own socket module is a shim that
          # scripts DNS and records every dial, so resolution, pinning, redirect handling, header
          # stripping and truncation all run for real against a server that reports what it got.
          # TLS is a pass-through whose one job is to record the server_hostname it was handed,
          # since that value IS the pinning property: the socket goes to a literal address while
          # the certificate is still checked against the name.
          npm run test:connector-http
