# Building the desktop app for macOS, and publishing it where people can get it.
#
# WHY THIS IS A WORKFLOW AND NOT A SCRIPT SOMEBODY RUNS. Tauri does not cross-compile, and the two
# staging scripts are host-specific by design — `prepare-payload.mjs` copies the machine's own Node
# binary and `prepare-python.mjs` downloads a CPython for the machine's own platform — so a bundle
# is not merely BUILT per chip, it is ASSEMBLED per chip. One machine cannot produce the pair. Two
# runners can.
#
# MAC ONLY, BECAUSE JAROKU LAUNCHES ON THE MAC (2026-10-09). Linux and Windows left the matrix
# rather than staying in it red. Both compile; Windows also bundled. Linux's AppImage did not:
# linuxdeploy walks every ELF under the bundle's resources, copies psycopg's vendored libraries out
# of the Python payload, then cannot resolve their dependencies from the new place. Bringing Linux
# back means shipping that payload as an archive linuxdeploy cannot see into, and pinning the
# runner to ubuntu-22.04 (glibc 2.35), the floor the bundled Node binary inherits.
#
# TWO macOS RUNNERS, NOT A UNIVERSAL BINARY. `--target universal-apple-darwin` is the tidier
# answer and cannot work here: it would need a universal Node to sit beside a universal Rust
# binary, and the Node release channel does not publish one. Two artefacts, each honest about
# which chip it is for.
#
# NOTHING HERE IS SIGNED. See the `Distribution` section of docs/tauri.md for what a tester has to
# do about that on each platform, and `Code signing` for where the certificates go when they exist.

name: Release

on:
  push:
    tags: ["v*"]
  # So a build can be exercised without cutting a tag — the failure mode this guards against is
  # discovering that the macOS runner cannot stage a payload on the day you wanted to ship.
  workflow_dispatch:

jobs:
  bundle:
    permissions:
      contents: write

    strategy:
      # NEVER fail-fast. An Intel build that breaks must not cancel an Apple silicon build that
      # would have succeeded — the whole point of a release run is to learn about both at once.
      fail-fast: false
      matrix:
        include:
          # macos-13 IS GONE: GitHub retired the image, and the Intel job of the last release run sat
          # for its full 24 hours waiting for a runner that will never come. `macos-15-intel` is the
          # Intel image that replaced it, and Apple silicon moves to the same macOS beside it.
          - platform: macos-15
            target: aarch64-apple-darwin
            label: macOS (Apple silicon)
          - platform: macos-15-intel
            target: x86_64-apple-darwin
            label: macOS (Intel)

    runs-on: ${{ matrix.platform }}
    name: ${{ matrix.label }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # The Rust dependency tree is ~400 crates and a cold build is fifteen minutes. Keyed by
      # target so the two runners never share an incompatible cache.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      # uv is what `prepare-python.mjs` STAGES — the bundle ships it, so the runner needs one to
      # copy and to resolve the lock file with.
      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix server ci
          npm --prefix client ci

      # THE PAYLOAD, before Tauri is invoked. `tauri build` does not know about these; the
      # `tauri:build` script chains them locally and this does the same thing one step at a time
      # so a failure names which half broke.
      - name: Stage the Node payload
        run: npm run tauri:payload

      - name: Stage the Python runtime
        run: npm run tauri:python

      # A draft, deliberately. It gives somebody the chance to read the notes and check both
      # artefacts arrived before anybody can download a release that is missing one — one chip of
      # the two succeeding is exactly the case where an automatic publish is worst.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # WHICH JAROKU A DOWNLOADED BUILD TALKS TO, and it has to be decided HERE because it is
          # read at COMPILE time. `src-tauri/src/backend.rs` resolves the mode from
          # `option_env!("JAROKU_BACKEND_URL")`, and an absent value is LOCAL — which is the right
          # default for `cargo test` and for somebody's laptop, and the wrong one for every artefact
          # this job uploads. That module's own header says why: "two installs of that are two
          # databases, and signing up on one of them is invisible to the other."
          #
          # It was absent here, so every published build shipped as its own private Jaroku: an
          # account made in one did not exist in another, and Google sign-in could not work at all,
          # because each install's callback would be `http://localhost:<port>/oauth/google/callback`
          # and `ports.rs` walks that port upward whenever 4317 is busy. There is no redirect URI you
          # can register for an address that differs per machine.
          #
          # A REPOSITORY VARIABLE WITH A LITERAL FALLBACK, so moving the API to another host — say
          # `wss://api.getjaroku.com` — is a settings change rather than a commit, while an unset
          # variable still cannot produce an empty value and fall back to LOCAL by accident.
          JAROKU_BACKEND_URL: ${{ vars.JAROKU_BACKEND_URL || 'wss://jaroku-api.fly.dev' }}
          # AD-HOC SIGNING ON macOS, AND IT IS NOT COSMETIC. An arm64 Mach-O binary must carry a
          # signature to execute at all — Apple silicon has no "unsigned" execution path the way
          # Intel did. An unsigned `.app` downloaded to an M-series Mac therefore fails with
          # *"Jaroku is damaged and can't be opened. You should move it to the Trash."*, which
          # reads as a corrupt download and is where a beta tester gives up.
          #
          # `-` is the ad-hoc identity: a signature with no certificate behind it. It does not
          # satisfy Gatekeeper and does not remove a single warning — what it does is turn an
          # app that CANNOT RUN into one that runs after right-click → Open. That is the whole
          # difference between a build friends can try and a build they cannot.
          #
          # A real Developer ID certificate replaces this and removes the warnings entirely; see
          # "Code signing" in docs/tauri.md.
          APPLE_SIGNING_IDENTITY: "-"
        with:
          # THE APP ONLY; THE DISK IMAGE IS MADE BELOW. See that step for why.
          args: --target ${{ matrix.target }} --bundles app
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}-dev', github.run_number) }}
          releaseName: "Jaroku ${{ github.ref_type == 'tag' && github.ref_name || format('build {0}', github.run_number) }}"
          releaseDraft: true
          prerelease: true
          releaseBody: |
            Jaroku for macOS, Apple silicon and Intel. Nothing here is code-signed yet, so the
            first install needs one extra step — see below.

            **macOS — use the one-line install.** A browser marks its downloads as quarantined and
            Gatekeeper then refuses an app signed by no certificate. `curl` sets no such mark, so
            this installs a build that opens with an ordinary double-click afterwards:
            ```
            curl -fsSL https://raw.githubusercontent.com/jackeddisciple/Jaroku/main/scripts/install.sh | sh
            ```
            It picks the right build for Apple silicon or Intel, copies it to `/Applications` and
            opens it. If you would rather take the `.dmg` below by hand, you can — but then macOS
            needs right-click → *Open* the first time, because a plain double-click on a
            quarantined unsigned app offers no way through.

            **First launch takes a minute.** The app unpacks a Node runtime and a complete Python
            environment into your home directory so that nothing has to be installed separately.
            Every launch after that is immediate.

      # THE DISK IMAGE IS MADE HERE, NOT BY TAURI. Tauri's `bundle_dmg.sh` lays its window out with a
      # Finder AppleScript, and on the Intel runner that took 13½ minutes in one run and died after
      # 9¾ in the next — with the app already built and signed. `hdiutil` alone makes the image
      # install.sh and a drag-install need (the app beside an Applications link) in well under a
      # minute, and is retried because a CI runner's `hdiutil` can find the device busy.
      #
      # AND UNDER TWO NAMES, BECAUSE A LANDING PAGE CANNOT LINK TO A MOVING TARGET. The versioned one
      # (`Jaroku_0.4.0_aarch64.dmg`) is right for an archive and useless for a download button: every
      # release would break every link on the site. The stable one never changes, so a button can
      # point at one URL for the life of the product:
      #
      #   https://github.com/OWNER/REPO/releases/latest/download/Jaroku-macos-arm64.dmg
      #
      # `--clobber` because a re-run of a build must replace its own upload rather than fail on
      # finding one already there.
      - name: Disk image, under a versioned and a stable name
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}-dev', github.run_number) }}
        run: |
          set -eu
          case "${{ matrix.platform }}" in
            macos-15)       arch='aarch64'; stable='Jaroku-macos-arm64.dmg' ;;
            macos-15-intel) arch='x64'    ; stable='Jaroku-macos-intel.dmg' ;;
          esac
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          app="src-tauri/target/${{ matrix.target }}/release/bundle/macos/Jaroku.app"
          [ -d "$app" ] || { echo "no Jaroku.app at $app"; exit 1; }

          stage="${RUNNER_TEMP}/dmg-root"
          rm -rf "$stage"; mkdir -p "$stage"
          ditto "$app" "$stage/Jaroku.app"
          ln -s /Applications "$stage/Applications"

          dmg="${RUNNER_TEMP}/Jaroku_${version}_${arch}.dmg"
          for attempt in 1 2 3; do
            hdiutil create -quiet -volname Jaroku -srcfolder "$stage" -fs HFS+ -format UDZO -ov "$dmg" && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            echo "hdiutil failed (attempt $attempt); retrying"; sleep 15
          done

          gh release upload "$TAG" "$dmg" --clobber --repo "${{ github.repository }}"
          cp "$dmg" "${RUNNER_TEMP}/$stable"
          gh release upload "$TAG" "${RUNNER_TEMP}/$stable" --clobber --repo "${{ github.repository }}"
          echo "uploaded $(basename "$dmg") and $stable"
