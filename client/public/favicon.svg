<!-- The Jaroku mark on its tile, traced from `assets/thenewlogo.png` and set the way the dock icon
     is: black ink on white, the bust standing on the tile's bottom edge. A browser tab is not this
     app's surface, so the mark sits on its own tile rather than in the page's own ink: a bare mark
     inherits whatever the tab strip happens to be and disappears on half of them.

     THE DOCK AND MENU BAR DO NOT COME FROM HERE. `scripts/tauri/gen-icons.mjs` reads the two PNGs
     in `assets/` directly — thenewlogo.png for the application icon, thenewmenubar.png for the macOS
     menu bar — because those are the artwork as drawn, and a tab icon is the one place that wants a
     vector. Change the mark and both of them move; this file is the only hand-written copy. -->
