<!-- The Jaroku mark on its plate, traced from `assets/mono.png` and coloured from
     `assets/mainlogo.png`. A browser tab is not this app's surface, so the mark is struck out of
     the brand plate rather than drawn in the page's own ink: a bare mark inherits whatever the tab
     strip happens to be and disappears on half of them.

     THE DOCK AND MENU BAR DO NOT COME FROM HERE. `scripts/tauri/gen-icons.mjs` reads the two PNGs
     in `assets/` directly — mainlogo.png for the application icon, mono.png for the macOS menu
     bar — because those are the artwork as drawn, and a tab icon is the one place that wants a
     vector. Change the mark and both of them move; this file is the only hand-written copy. -->
