<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The mark, on a tile rather than transparent: a browser tab is not this app's surface, and a
         logo drawn in the page's own ink on whatever the tab strip happens to be is a logo that
         disappears on half of them. So favicon.svg carries the dock icon's white tile with the mark
         in black on it. Same path as lib/icons.tsx, traced from assets/thenewlogo.png.

         THE TILE'S COLOURS LIVE IN AN .svg RATHER THAN HERE. §05 writes NONE in the
         `--color-brand` row and `test:colour-system` holds `BRAND.base` to null; a brand colour in
         `src/**/*.tsx` would be one the palette does not have. The icon assets are not source,
         which is why they may. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Jaroku — Trace</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
