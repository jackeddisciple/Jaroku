<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The mark, filled rather than transparent: a browser tab is not this app's surface, and a
         logo drawn in the page's own ink on whatever the tab strip happens to be is a logo that
         disappears on half of them. So favicon.svg carries the brand plate with the mark struck
         out of it — the same "ink turned inside out" a primary button is. Same three contours as
         lib/icons.tsx, traced from assets/mono.png.

         THE PLATE IS THE ONE PLACE THE BRAND ORANGE LIVES IN THE CLIENT, and it lives in an .svg
         rather than here. §05 writes NONE in the `--color-brand` row and `test:colour-system`
         holds `BRAND.base` to null; an orange in `src/**/*.tsx` would be a second brand colour
         the palette does not have. The icon assets are not source, which is why they may. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Jaroku — Trace</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
