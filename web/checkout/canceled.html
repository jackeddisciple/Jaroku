<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>No changes made — Jaroku</title>
<!--
  checkout.jaroku.dev/canceled — the other half of the pair, and it exists for the same reason:
  a `cancel_url` has to be a real web page, because Stripe redirects a browser and will not accept
  a `jaroku://` URL as one.

  ITS WHOLE JOB IS TO SAY NOTHING HAPPENED. Somebody who backs out of a payment form is not a
  problem to be solved on the way out — no "are you sure", no discount, no countdown. The
  specification's own words are "no dark patterns", and the cancel page is where that is easiest
  to break and least often noticed.

  IT LANDS THE APP ON A KNOWN STATE rather than leaving somebody stranded in a browser tab
  wondering whether they were charged. `jaroku://billing/canceled` is the app's cue to drop the
  "complete payment in your browser" state it has been holding since the hop out.
-->
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background: #0d0d0f; color: #e4e4e7;
    font: 400 14px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Inter, sans-serif;
  }
  .card {
    width: 100%; max-width: 420px; padding: 32px; text-align: center;
    background: #18181b; border: 1px solid #2a2a30; border-radius: 14px;
  }
  .mark {
    width: 40px; height: 40px; margin: 0 auto 20px; display: grid; place-items: center;
    border-radius: 50%; background: #1e1e22; color: #71717a;
  }
  h1 { margin: 0 0 8px; font-size: 17px; font-weight: 600; }
  p { margin: 0; font-size: 13px; color: #71717a; }
  .btn {
    display: inline-block; margin-top: 24px; padding: 9px 18px;
    background: #18181b; color: #e4e4e7; border: 1px solid #2a2a30; border-radius: 8px;
    font-size: 13px; font-weight: 500; text-decoration: none;
  }
  .btn:hover { background: #1e1e22; }
  .quiet { margin-top: 16px; font-size: 12px; color: #52525b; }
</style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 6 6 18M6 6l12 12" />
      </svg>
    </div>
    <h1>No changes made</h1>
    <!-- The one fact somebody backing out of a card form wants confirmed, said plainly and first. -->
    <p>You have not been charged, and your plan is exactly as it was.</p>
    <a class="btn" id="open" href="jaroku://billing/canceled">Back to Jaroku</a>
    <p class="quiet">You can close this tab.</p>
  </main>
<script>
  // No query to carry: there is no session to report and nothing to poll for. A constant target,
  // built here rather than left to the href alone only so the two pages behave identically.
  var target = 'jaroku://billing/canceled';
  setTimeout(function () { location.href = target; }, 700);
</script>
</body>
</html>
